<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="csrf-token" content="{{ csrf_token }}">
	<meta name="robots" content="noindex">
	<title>{{ _("Invoice") }} {{ invoice }} · {{ app_name }}</title>
	<link rel="stylesheet" href="/assets/a3_retail/css/a3_branch.css?v={{ asset_v }}">
	<script src="/assets/a3_retail/js/a3_branch.js?v={{ asset_v }}" defer></script>
	<script src="/assets/a3_retail/js/a3_invoice.js?v={{ asset_v }}" defer></script>
</head>
<body class="pos-body">
<div class="app">

	{% include "a3_retail/www/retail/_sidebar.html" %}

	<div class="main">
		<header class="topbar">
			<div class="topbar-branch topbar-title">
				<h1 id="title">{{ _("Invoice") }} {{ invoice }}</h1>
				<p class="topbar-sub" id="subtitle"></p>
			</div>
			<div class="topbar-right" id="top-actions">
				<a class="btn btn-quiet" href="/retail/bills">← {{ _("Back to Bills") }}</a>
				<div class="who">
					<div class="name">{{ me.employee_name }}</div>
					<div class="role">{{ me.designation or "" }}</div>
				</div>
				<div class="avatar">{{ initials }}</div>
				<a class="btn btn-quiet" href="/retail/logout">{{ _("Sign out") }}</a>
			</div>
		</header>

		<main class="inv" id="body">
			<div class="pos-loading">{{ _("Loading the invoice…") }}</div>
		</main>
	</div>
</div>

<div class="modal" id="payment-modal" hidden>
	<div class="modal-card">
		<h3>{{ _("Collect payment") }}</h3>
		<p class="modal-note" id="payment-note"></p>
		<div class="field-grid">
			<label class="field"><span>{{ _("Amount") }}</span>
				<input id="pay-amount" type="number" min="0" step="1"></label>
			<label class="field"><span>{{ _("Mode") }}</span>
				<select id="pay-mode">
					{% for mode in ["Cash", "Card", "UPI", "Wallet", "Other"] %}
					<option value="{{ mode }}">{{ mode }}</option>{% endfor %}
				</select></label>
		</div>
		<label class="field"><span>{{ _("Reference (optional)") }}</span>
			<input id="pay-reference" placeholder="{{ _('UPI reference, card slip…') }}"></label>
		<div class="modal-actions">
			<button class="btn btn-quiet" data-close>{{ _("Cancel") }}</button>
			<button class="btn btn-primary" id="pay-save">{{ _("Take payment") }}</button>
		</div>
	</div>
</div>

<script>
window.addEventListener("DOMContentLoaded", function () {
	INVOICE.start({
		name: {{ invoice|tojson }},
		branch: {{ me.branch|tojson }},
		company: {{ company|tojson }},
	});
});
</script>
</body>
</html>
