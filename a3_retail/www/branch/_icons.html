{#- One line-art icon set for the branch app. `icon` names the glyph. -#}

{%- elif icon == "filter" -%}

{%- elif icon == "refresh" -%}

{%- elif icon == "star" -%}

	<path d="M12 3 20 6v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>
{%- elif icon == "truck" -%}
	<rect x="2" y="7" width="12" height="9" rx="2"/><path d="M14 10h4l3 3v3h-7z"/>
	<circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>
{%- endif -%}
