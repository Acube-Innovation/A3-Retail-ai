{#- One line-art icon set for the branch app. `icon` names the glyph. -#}
<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if icon == "grid" -%}
	<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
	<rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif icon == "tag" -%}
	<path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9-9-9z"/><circle cx="7.5" cy="7.5" r="1.4"/>
{%- elif icon == "users" -%}
	<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6M17 14.4a5.5 5.5 0 0 1 4 5.6"/>
{%- elif icon == "file" -%}
	<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>
{%- elif icon == "chart" -%}
	<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif icon == "box" -%}
	<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>
{%- elif icon == "wrench" -%}
	<path d="M14.7 6.3a4 4 0 0 0 5 5L21 21H10L4.3 15.3a4 4 0 0 1 5-5z"/><path d="M9 9l6 6"/>
{%- elif icon == "chip" -%}
	<rect x="7" y="7" width="10" height="10" rx="2"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/>
{%- elif icon == "plug" -%}
	<path d="M9 3v6M15 3v6M6 9h12v3a6 6 0 0 1-12 0z"/><path d="M12 18v3"/>
{%- elif icon == "gear" -%}
	<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
{%- elif icon == "search" -%}
	<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
{%- elif icon == "phone" -%}
	<path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
{%- elif icon == "trash" -%}
	<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>
{%- elif icon == "cash" -%}
	<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/>
{%- elif icon == "card" -%}
	<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
{%- elif icon == "upi" -%}
	<path d="M6 4l5 8-5 8M13 4l5 8-5 8"/>
{%- elif icon == "wallet" -%}
	<path d="M3 7a2 2 0 0 1 2-2h12v4"/><rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="17" cy="13" r="1.3"/>
{%- elif icon == "emi" -%}
	<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6M7 17h4"/>
{%- elif icon == "other" -%}
	<circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/>
{%- elif icon == "clock" -%}
	<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif icon == "pause" -%}
	<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M10 9v6M14 9v6"/>
{%- elif icon == "eraser" -%}
	<path d="M4 16 14 6l5 5-8 8H6z"/><path d="M3 21h18"/>
{%- elif icon == "draft" -%}
	<path d="M4 20h16M6 16V6a2 2 0 0 1 2-2h6l4 4v8"/><path d="M9 9h5M9 12h6"/>
{%- elif icon == "heart" -%}
	<path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9z"/>
{%- elif icon == "price" -%}
	<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M9 11h4M11 9v4"/>
{%- elif icon == "list" -%}
	<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
{%- elif icon == "tiles" -%}
	<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/>
	<rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/>
{%- endif -%}
</svg>
