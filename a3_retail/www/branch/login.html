<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ _("Sign in") }} · {{ app_name }}</title>
	<meta name="description" content="{{ _('Branch app for A3 Retail — sign in to your shop.') }}">
	<meta name="robots" content="noindex">
	<link rel="stylesheet" href="/assets/a3_retail/css/a3_branch.css">
	<script src="/assets/a3_retail/js/a3_branch.js" defer></script>
</head>
<body>
<main class="login-shell">
	<div class="login-box">
		<div class="login-head">
			{% include "a3_retail/www/branch/_mark.html" %}
			<h1>{{ _("Sign in") }}</h1>
			<p>{{ _("Welcome back to the {0} branch app").format(company) }}</p>
		</div>

		<form class="card" id="login-form" autocomplete="on" novalidate>
			<div class="field">
				<label for="usr">{{ _("Work email") }}</label>
				<input id="usr" name="username" type="email" inputmode="email"
				       autocomplete="username" placeholder="you@mobileworld.in"
				       autofocus required>
			</div>

			<div class="field">
				<label for="pwd">{{ _("Password") }}</label>
				<input id="pwd" name="password" type="password"
				       autocomplete="current-password" placeholder="••••••••" required>
			</div>

			<button class="btn btn-primary btn-block" type="submit" id="submit">
				{{ _("Sign in") }}
			</button>

			<div class="msg" id="msg" role="status" aria-live="polite"></div>
		</form>

		<p class="login-foot">
			{{ _("Trouble signing in? Ask your branch manager.") }}<br>
			{{ _("Head office and accounts use the main system.") }}
		</p>
	</div>
</main>

<script>
window.addEventListener("DOMContentLoaded", function () {
	const form = document.getElementById("login-form");
	const button = document.getElementById("submit");
	const msg = document.getElementById("msg");

	form.addEventListener("submit", async function (event) {
		event.preventDefault();
		button.disabled = true;
		msg.className = "msg";
		msg.textContent = "{{ _('Signing you in…') }}";

		try {
			await A3.login(
				document.getElementById("usr").value.trim(),
				document.getElementById("pwd").value
			);
			window.location.href = "{{ home_page }}";
		} catch (error) {
			msg.className = "msg error";
			msg.textContent = "{{ _('That email and password do not match.') }}";
			button.disabled = false;
			document.getElementById("pwd").select();
		}
	});
});
</script>
</body>
</html>
